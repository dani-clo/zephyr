title: Microchip SDHC controller

description: |
  Microchip SDHC controller

  Microchip G1 SDHC controller supports the following hardware peripheral:
    - module name="SDHC" compatible="microchip,sdhc-g1"

compatible: "microchip,sdhc-g1"

include:
  - name: sdhc.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true

  clocks:
    required: true

  clock-names:
    required: true
    description: |
      Names of the clock sources listed in "clocks", in the same order.
      Must be "mclk" (main clock), "gclk" (generic clock) and "gclk-slow"
      (slow generic clock).

  interrupts:
    required: true

  auto-cmd12:
    type: boolean
    description: |
      Enable Auto CMD12 for multi-block transfers. The host controller
      automatically issues CMD12 (stop transmission) after the last block.
      Use this for cards that do not support CMD23.

  auto-cmd23:
    type: boolean
    description: |
      Enable Auto CMD23 for multi-block transfers. The host controller
      automatically issues CMD23 (set block count) before the transfer.
      Requires ADMA and card CMD23 support (SCR bit 33). Takes precedence
      over auto-cmd12 if both are set.

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true
    description: |
      Names of the pinctrl states defined for this controller. Must include
      "default" matching pinctrl-0.

  bus-width:
    type: int
    enum:
      - 1
      - 4
    default: 4
    description: |
      SD bus width in bits
      By default 4-bit data line is enabled and can be adjusted based on the SDMMC
      instance or hardware board design.

examples:
  - |
    #Example devicetree configuration for Microchip G1 SDHC controller:

    sdhc0: sdhc@46000000 {
            compatible = "microchip,sdhc-g1";
            reg = <0x46000000 0x234>;
            interrupts = <136 0>;
            clocks = <&mclkperiph CLOCK_MCHP_MCLKPERIPH_ID_AHB_SDHC1>,
                     <&gclkperiph CLOCK_MCHP_GCLKPERIPH_ID_SDHC1>,
                     <&gclkperiph CLOCK_MCHP_GCLKPERIPH_ID_SDHC1_SLOW>;
            clock-names = "mclk", "gclk", "gclk-slow";
            min-bus-freq = <400000>;
            max-bus-freq = <50000000>;
            auto-cmd23;
            pinctrl-0 = <&sdhc0_default>;
            pinctrl-names = "default";
            status = "okay";
    };
