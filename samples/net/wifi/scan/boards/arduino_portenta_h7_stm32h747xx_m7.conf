CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_AIROC_WIFI_EVENT_TASK_STACK_SIZE=8192
CONFIG_NET_MGMT_EVENT_STACK_SIZE=2048

# Portenta default code partition is too small for AIROC Wi-Fi stack.
# Build this sample at flash offset 0 for local development.
CONFIG_USE_DT_CODE_PARTITION=n
CONFIG_FLASH_LOAD_OFFSET=0

# SDHC must init before AIROC Wi-Fi driver (SDHC=85 < WIFI=95).
CONFIG_WIFI_INIT_PRIORITY=95