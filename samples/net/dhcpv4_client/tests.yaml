sample:
  name: DHCP Client
tests:
  sample.net.dhcpv4_client:
    harness: net
    depends_on: netif
    tags:
      - net
      - http
  sample.net.dhcpv4_client.qemu:
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "Run dhcpv4 client"
        - "Address\\[[0-9]+\\]: 10\\.0\\.2\\."
    platform_allow:
      - qemu_riscv32
      - qemu_riscv32e
      - qemu_riscv64
    extra_configs:
      - CONFIG_NET_QEMU_USER=y
  sample.net.dhcpv4_client.portenta_h7.normal:
    platform_allow:
      - arduino_portenta_h7/stm32h747xx/m7
    integration_platforms:
      - arduino_portenta_h7/stm32h747xx/m7
    depends_on: netif
    tags:
      - net
      - ethernet
    extra_args:
      - EXTRA_CONF_FILE=boards/portenta_h7_validation.conf
      - DTC_OVERLAY_FILE=boards/portenta_h7_validation.overlay
    timeout: 120
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - 'Before init: .*mdio.* ready=1'
        - 'Before init: .*ethernet-phy.* ready=1'
        - 'Before init: ethernet ready=1'
        - 'After init: ethernet ready=1'
        - 'Address\[[0-9]+\]:'
  sample.net.dhcpv4_client.portenta_h7.deferred:
    platform_allow:
      - arduino_portenta_h7/stm32h747xx/m7
    integration_platforms:
      - arduino_portenta_h7/stm32h747xx/m7
    depends_on: netif
    tags:
      - net
      - ethernet
    extra_args:
      - EXTRA_CONF_FILE=boards/portenta_h7_validation.conf
      - DTC_OVERLAY_FILE="boards/portenta_h7_validation.overlay;boards/portenta_h7_deferred.overlay"
    timeout: 120
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - 'Before init: .*mdio.* ready=0'
        - 'Before init: .*ethernet-phy.* ready=0'
        - 'Before init: ethernet ready=0'
        - 'Waiting 5 seconds before Ethernet device initialization'
        - 'After init: ethernet ready=1'
        - 'Address\[[0-9]+\]:'
